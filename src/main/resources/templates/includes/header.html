<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style-header.css}">
</head>

<body>

<header th:fragment="header">

<nav class="navbar navbar-expand-lg app-header">

    <div class="container">

        <!-- Logo -->
    	<a th:href="@{/}" class="navbar-brand  logo">Life Ledger</a>

        <!-- Hamburger -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav mx-auto gap-lg-4">

                <li class="nav-item">
                    <a class="nav-link nav-link-custom"
                       th:href="@{/dashboard}"
                       th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">
                        ダッシュボード
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-custom"
                       th:href="@{/income}"
                       th:classappend="${currentPage == 'income'} ? ' active' : ''">
                        収入
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-custom"
                       th:href="@{/expense}"
                       th:classappend="${currentPage == 'expense'} ? ' active' : ''">
                        費用
                    </a>
                </li>

            </ul>

            <form th:action="@{/logout}" method="post">

                <button class="btn btn-danger">
                    ログアウト
                </button>

            </form>
        </div>
    </div>
</nav>
</header>

</body>
</html>
