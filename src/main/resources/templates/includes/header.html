<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style-header.css}">
</head>

<body>

<header th:fragment="header"
        class="app-header d-flex justify-content-between align-items-center px-4">

    <!-- Logo -->
    <a th:href="@{/}" class="logo">Life Ledger</a>

    <!-- Navigation -->
    <nav class="nav-links">

	    <a th:href="@{/dashboard}"
	       class="nav-link-custom"
	       th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">
	       ダッシュボード
	    </a>
	
	    <a th:href="@{/income}"
	       class="nav-link-custom"
	       th:classappend="${currentPage == 'income'} ? ' active' : ''">
	       収入
	    </a>
	
	    <a th:href="@{/expense}"
	       class="nav-link-custom"
	       th:classappend="${currentPage == 'expense'} ? ' active' : ''">
	       費用
	    </a>
	
	</nav>

    <!-- Logout -->
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-danger btn-sm">
            ログアウト
        </button>
    </form>

</header>


</body>
</html>
