<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- INDIVIDUAL EXPENSE MODAL -->
<div th:fragment="addExpenseModal" class="modal fade" id="searchaddExModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content p-4">

            <form th:action="@{/addExpense}" method="post">

                <!-- HEADER -->
                <div class="container text-center mb-3">

                    <div class="row">
                        <div class="col-9">
                            <h2 class="fw-bold text-primary">Add New Expenses</h2>
                        </div>

                        <div class="col-3">
                            <div class="date-box mb-3">
                                <input type="date" name="expenseDate" class="form-control form-control-lg shadow-sm"
                                       th:value="${#dates.format(#dates.createNow(),'yyyy-MM-dd')}" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AMOUNT -->
				<div class="input-group input-group-lg mb-4 cost-group shadow-sm">    	
				    <span class="input-group-text bg-primary text-white fw-bold">Cost</span>	
					<input type="tel"
					       id="amount"
					       name="amount"
					       class="form-control text-end fw-bold border-primary fs-4"
					       placeholder="0"
					       inputmode="numeric"
					       autocomplete="off"
					       required>
				    <span class="input-group-text bg-light fw-bold">円</span>				
				</div>
				
                <!-- MAIN CATEGORY ERROR -->                
                <div id="categoryError" class="text-danger fw-bold mt-2" style="display:none;">
				    Please select an expenses category.
				</div>
				
				<label id="expensesCategoryLabel" class="form-label fw-semibold">Expenses category</label>
				
                <!-- MAIN CATEGORY GRID -->
                <div class="category-grid">
                
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="一般事項">
                        <img src="/images/expense-icon/general-icon.png" class="expense-icon">
                        <br>一般事項
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="住宅">
                        <img src="/images/expense-icon/home-icon.png" class="expense-icon">
                        <br>住宅
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="修正済み">
                        <img src="/images/expense-icon/fixed-expense-icon.png" class="expense-icon">
                        <br>修正済み
                    </label>
                                        
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="個人">
                        <img src="/images/expense-icon/personal-icon.png" class="expense-icon">
                        <br>個人
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="家族・子供">
                        <img src="/images/expense-icon/family-Kids-icon.png" class="expense-icon">
                        <br>家族・子供
                    </label>
                                        
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="教育">
                        <img src="/images/expense-icon/education-icon.png" class="expense-icon">
                        <br>教育
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="ペット">
                        <img src="/images/expense-icon/pet-icon.png" class="expense-icon">
                        <br>ペット
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="医療">
                        <img src="/images/expense-icon/medical-icon.png" class="expense-icon">
                        <br>医療	
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="買い物">
                        <img src="/images/expense-icon/shopping-icon.png" class="expense-icon">
                        <br>買い物
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="食費">
                        <img src="/images/expense-icon/food-icon.png" class="expense-icon">
                        <br>食費
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="ギフト">
                        <img src="/images/expense-icon/gifts-icon.png" class="expense-icon">
                        <br>ギフト
                    </label>

                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="交通費">
                        <img src="/images/expense-icon/transport.png" class="expense-icon">
                        <br>交通費
                    </label>
                    
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="旅行">
                        <img src="/images/expense-icon/travel-icon.png" class="expense-icon">
                        <br>旅行
                    </label>
                            
                    <label class="category-card">
                        <input type="radio" name="mainCategory" value="その他">
                        <img src="/images/expense-icon/other-icon.png" class="expense-icon">
                        <br>その他	
                    </label>
                    
                </div>
                
                <!-- SUB CATEGORY -->
				<div class="mt-4 mb-5">
					<div class="row">
						<div class="col">

						<label id="subcategoryLabel" class="form-label fw-semibold">SubCategory</label>
						
						<select id="subCategory" name="subCategory" class="form-select">
							<option value="">Select a subcategory</option>
						</select>
						<div id="subNoteError" class="text-danger fw-bold mt-1" style="display:none;">
						    Please select a subcategory or add a note.
						</div>
							
						</div>
						<div class="col">
		                    <label for="note" class="form-label text-dark fw-semibold">Note</label>
							<input type="text" id="note" name="note" class="form-control">
						</div>
					</div>
				</div>
				
				<div class="d-flex justify-content-center gap-3 mt-4">
				    <!-- CLEAR -->
				    <button type="button" id="clearExpenseFormBtn" class="btn btn-danger px-5 w-50">Clear</button>				
				    <!-- SUBMIT -->
				    <button type="submit" class="btn btn-primary px-5 w-50">Save Expense</button>				
				</div>
				
            </form>
        </div>
    </div>
</div>

</body>
</html>
