<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
<div th:fragment="expenseDeleteConfirmModal">
	<div class="modal fade" id="expenseDeleteConfirmModal" tabindex="-1">
	    <div class="modal-dialog modal-dialog-centered">
	        <div class="modal-content p-4">
	
	            <form th:action="@{/deleteExpense}" method="post">
	
	                <input type="hidden" id="deleteExpenseId" name="expenseId">
	
	                <div class="text-center mb-3">
	                    <h3 class="text-danger">削除確認</h3>
	                </div>
	
	                <div class="text-center mb-2">
	                    <h5 class="text-danger">
	                        登録された支出情報を削除しますか？
	                    </h5>
	                </div>
	
	                <div class="table-responsive">
	                    <table class="table">
	
	                        <tr>
	                            <th class="w-25">日付</th>
	                            <td id="deleteExpenseDate"></td>
	                        </tr>
	
	                        <tr>
	                            <th>メインカテゴリー</th>
	                            <td id="deleteExpenseMainCategory"></td>
	                        </tr>
	
	                        <tr>
	                            <th>サブカテゴリー</th>
	                            <td id="deleteExpenseSubCategory"></td>
	                        </tr>
	
	                        <tr>
	                            <th>金額</th>
	                            <td id="deleteExpenseAmount"></td>
	                        </tr>
	
	                        <tr>
	                            <th>ノート</th>
	                            <td id="deleteExpenseNote"></td>
	                        </tr>
	
	                    </table>
	                </div>
	
	                <div class="d-flex justify-content-center gap-3">
	
	                    <button type="button"
	                            class="btn btn-secondary"
	                            id="backToExpenseEditModal">
	                        戻る
	                    </button>
	
	                    <button type="submit"
	                            class="btn btn-danger">
	                        削除
	                    </button>
	
	                </div>
	
	            </form>
	
	        </div>
	    </div>
	</div>
</div>

</body>
</html>
