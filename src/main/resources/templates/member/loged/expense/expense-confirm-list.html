<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- CONFIRM MODAL -->
<div th:fragment="confirmExpenseModal"
     class="modal fade"
     id="searchConfirmListExModal"
     tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content p-4">

            <h2 class="text-center mb-4">
                Confirm Expense List
            </h2>

			<!-- TABLE WRAPPER -->
			<div class="expense-table-wrapper">
				<table class="table table-bordered table-striped align-middle">				
	 
	    			 <thead class="table-primary text-center">	
				        <tr style="border-bottom: 2px solid #adb5bd;">
				            <th style="width:15%;">Date</th>
				            <th style="width:15%;">Cost</th>
				            <th style="width:20%;">Main Category</th>
				            <th style="width:20%;">Sub Category</th>
				            <th style="width:30%;">Note</th>
				        </tr>				
				    </thead>
	
	                <tbody id="confirmExpenseTableBody" style="border: 1px solid #adb5bd !important;">
	
	                </tbody>
	
	            </table>
            </div>

            <div class="d-flex justify-content-center mt-4">
            
			    <!-- BACK -->
                <button type="button"
				        class="btn btn-secondary me-5"
				        id="backToCaptureModalBtn">戻る
				</button>
								
			    <!-- SAVE -->
			    <button type="button" class="btn btn-primary" id="saveExpenseListBtn">経費登録　</button>	
            </div>

        </div>

    </div>

</div>

</body>
</html>
