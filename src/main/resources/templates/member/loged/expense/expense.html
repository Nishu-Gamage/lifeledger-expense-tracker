<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Expense</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style-header.css}">
    <link rel="stylesheet" th:href="@{/css/style-dashboard-tabs.css}">
</head>
<body>
<!-- HEADER -->
<div th:replace="~{includes/header :: header}"></div>

<!-- PAGE CONTENT -->
<div class="container mt-3">
    <h2 class="mb-2 text-center">費用ダッシュボード画面</h2>
    <!-- NAV TABS -->
    <ul class="nav nav-tabs nav-fill border-0 shadow-sm dashboard-tabs" role="tablist">
	    <li class="nav-item">
	        <button class="nav-link active fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-home" type="button">
	            今月の経費概要
	        </button>
	    </li>	
	    <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-menu1" type="button">
	            経費の月間比較
	        </button>
	    </li>	
	    <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-menu2" type="button">
	            日々の支出
	        </button>
	    </li>
	</ul>
	
	<div class="tab-content mt-3 dashboard-tab-content">	
	    <div id="exp-home" class="tab-pane fade show active">
	        <h5 class="fw-bold text-primary">今月の経費概要</h5>
	    </div>	
	    <div id="exp-menu1" class="tab-pane fade">
	        <h5 class="fw-bold text-primary">経費の月間比較</h5>
	    </div>	
	    <div id="exp-menu2" class="tab-pane fade">
	        <h5 class="fw-bold text-primary">日々の支出</h5>
	    </div>	
	</div>
  </div>
  
<!-- LOAD MODALS -->
<!-- INDIVIDUAL MODAL -->
<div th:replace="~{member/loged/expense/expense-capture-individually :: addExpenseModal}"></div>
<!-- LIST MODAL -->
<div th:replace="~{member/loged/expense/expense-capture-list :: addExpenseListModal}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- CATEGORY DATA -->
<script th:src="@{/js/expense-categories.js}"></script>

<!-- MAIN JS -->
<script th:src="@{/js/expense-capture.js}"></script>

</body>
</html>
