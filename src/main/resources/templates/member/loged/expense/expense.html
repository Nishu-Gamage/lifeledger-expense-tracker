<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
      
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
    
    <title>Expense</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style-header.css}">
    <link rel="stylesheet" th:href="@{/css/style-dashboard-tabs.css}">
    <link rel="stylesheet" th:href="@{/css/style-expense.css}">
</head>
<body>
<!-- HEADER -->
<div th:replace="~{includes/header :: header}"></div>

<!-- PAGE CONTENT -->
<div class="container mt-3">
    <h2 class="mb-2 text-center">費用ダッシュボード画面</h2>
    <!-- NAV TABS -->
    <ul class="nav nav-tabs nav-fill border-0 shadow-sm dashboard-tabs" role="tablist">
	    <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-home" type="button">
	            今月の経費概要
	        </button>
	    </li>
	    <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-menu1" type="button">
	            経費の月間比較
	        </button>
	    </li>
	    <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                data-bs-toggle="tab" data-bs-target="#exp-menu2" type="button">
	            日々の支出
	        </button>
	    </li>
	</ul>
	
	<div class="tab-content mt-2 dashboard-tab-content">
	    <div id="exp-home" class="tab-pane fade">
        	<div th:replace="member/loged/expense/summary-expense :: exp-home"></div>
	    </div>	
	    <div id="exp-menu1" class="tab-pane fade">
        	<div th:replace="member/loged/expense/monthly-expense :: exp-menu1"></div>
	    </div>	
	    <div id="exp-menu2" class="tab-pane fade">
        	<div th:replace="~{member/loged/expense/daily-expense :: exp-menu2}"></div>
	    </div>	
	</div>
 </div>
 
 
<!-- BUTTONS -->
<div class="d-flex justify-content-center align-items-center gap-3 py-3">
    <!-- INDIVIDUAL EXPENSE -->
    <div sec:authorize="hasRole('USER')">
        <button type="button"
                class="btn btn-primary btn-lg px-4 py-2"
                data-bs-toggle="modal"
                data-bs-target="#searchaddExModal">
            経費を個別登録
        </button>
    </div>

    <!-- LIST EXPENSE -->
    <div sec:authorize="hasRole('USER')">
        <button type="button"
                class="btn btn-outline-primary btn-lg px-4 py-2"
                data-bs-toggle="modal"
                data-bs-target="#searchAddListExModal"
                style="background-color:#ADD8E6; color:black;">
            経費を一覧登録
        </button>
    </div>
</div>
 

<!-- LOAD MODALS -->
<div th:replace="~{member/loged/expense/expense-capture-individually :: addExpenseModal}"></div>
<div th:replace="~{member/loged/expense/expense-capture-list :: addExpenseListModal}"></div>
<div th:replace="~{member/loged/expense/expense-confirm-list :: confirmExpenseModal}"></div>
<div th:replace="~{member/loged/expense/expense-edit :: ExpenseEditModal}"></div>
<div th:replace="~{member/loged/expense/expense-delete-confirm :: expenseDeleteConfirmModal}"></div>
<div th:replace="~{member/loged/expense/expense-update-confirm :: expenseUpdateConfirmModal}"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/expense-categories.js}"></script>
<script th:src="@{/js/expense.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/expense-capture.js}"></script>
<script th:src="@{/js/expense-list-capture.js}"></script>
<script th:src="@{/js/expense-confirm-list.js}"></script>
<script th:src="@{/js/expense-edit.js}"></script>

</body>
</html>
