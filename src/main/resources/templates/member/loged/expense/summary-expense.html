<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="exp-home">

	<!-- SELECT YEAR & MONTH -->
	<form method="get" th:action="@{/expense}">
	    <div class="d-flex align-items-center gap-1 mb-1">	
	        <select name="summaryYear"
	                class="form-select form-select-sm w-auto border-success bg-primary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="y : ${years}"
	                    th:value="${y}"
	                    th:text="${y}"
	                    th:selected="${y == selectedYear}">
	            </option>	
	        </select>
	
	        <select name="month"
	                class="form-select form-select-sm w-auto border-success bg-secondary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="m : ${#numbers.sequence(1,12)}"
	                    th:value="${m}"
	                    th:text="${m + '月'}"
	                    th:selected="${m == selectedMonth}">
	            </option>
	        </select>	
	    </div>	
	</form>

	<!-- EXPENSE TOP SUMMARY TABLE -->	
	<div class="row justify-content-center">
	    <div class="col-12">		    
		    <div class="row justify-content-center">

			    <!-- Table 1 -->
			    <div class="col-md-4">
			        <table class="table table-striped table-bordered text-center">
                		<thead class="table-warning sticky-top">
			                <tr>
			                    <th class="py-0">総支出額</th>
			                </tr>
		                </thead>
			            <tbody>
			                <tr>
			                    <td class="fs-4 py-2 fw-bold text-primary"
			                        th:text="'¥ ' + ${#numbers.formatInteger(totalExpense,0,'COMMA')}">
			                    </td>
			                </tr>
			            </tbody>
			        </table>
			    </div>
					
			    <!-- Table 2 -->
			    <div class="col-md-4 ms-5">
			        <table class="table table-striped table-bordered text-center">
                		<thead class="table-warning sticky-top">
			                <tr>
			                    <th class="py-0">最も多く費やされたのは</th>
			                </tr>
			            </thead>
			            <tbody>
			                <tr>
								<td class="fs-4 py-2 fw-bold text-primary"
										th:text="${topCategory}"> 
								</td>
			                </tr>
			            </tbody>
			        </table>
			    </div>			
			</div>
	    </div>	
	</div>
		
	<div class="row justify-content-center gx-5">
		<!-- CATEGORY SUMMARY -->
	    <div class="col-lg-3 mt-1">
	    	<div class="p-3 rounded shadow-sm border" style="background-color:#2F4F4F;">
	        	<h5 class="fw-bold text-white mb-3 text-center">
		            カテゴリー別費用概要
		        </h5>
		
		        <div style="max-height: 200px; overflow-y: auto;">
	            <table class="table table-bordered table-striped text-center mb-0">
		                <thead class="table-warning sticky-top">
		                    <tr>
		                        <th>メインカテゴリー</th>
		                        <th>出額</th>
		                    </tr>
		                </thead>
		
		                <tbody>
		                    <tr th:each="item : ${expenseCategorySummary}">
		                        <td th:text="${item.mainCategory}"></td>
		                        <td th:text="${#numbers.formatInteger(item.totalAmount,0,'COMMA')}"></td>
		                    </tr>
		                    
		                    <!-- NO DATA -->
						    <tr th:if="${#lists.isEmpty(expenseCategorySummary)}">
						
						        <td colspan="2" class="text-center text-danger fw-bold">					
						            希望のデータが見つかりません。					
						        </td>
							
						    </tr>
		                </tbody>
		            </table>
		        </div>
	        </div>
	    </div>
	    		
	   	<!-- ALL INCOME -->
	    <div class="col-lg-8 mt-1">
	    	<div class="p-3 rounded shadow-sm border" style="background-color:#5F9EA0;">
	       	<h5 class="fw-bold text-white mb-3 text-center">
	            すべての支出情報
	        </h5>

	        <div style="max-height: 200px; overflow-y: auto;">
	            <table class="table table-bordered table-striped text-center mb-0">
	                <thead class="table-warning sticky-top">
	                    <tr>
	                        <th style="width:15%">日付</th>
	                        <th style="width:15%">カテゴリー</th>
	                        <th style="width:18%">サブカテゴリー</th>
	                        <th style="width:12%">金額</th>
	                        <th style="width:20%">ノート</th>
	                        <th style="width:15%">更新/削除</th>
	                    </tr>
	                </thead>
	
	                <tbody>

		                <tr th:each="expense : ${expenseList}">
		
		                    <td class="py-1" th:text="${expense.expenseDate}"></td>		
		                    <td class="py-1" th:text="${expense.mainCategory}"></td>		
		                    <td class="py-1" th:text="${expense.subCategory}"></td>		
		                    <td class="text-end py-1"
		                        th:text="'¥ ' + ${#numbers.formatInteger(expense.amount,0,'COMMA')}">
		                    </td>	
		                    <td th:text="${expense.note}"></td>	
							<td class="py-1">
							    <button type="button"
							            class="btn btn-sm btn-outline-secondary"
						
						            data-bs-toggle="modal"
						            data-bs-target="#expenseEditModal"
						
						            th:data-id="${expense.id}"
						            th:data-date="${expense.expenseDate}"
						            th:data-main-category="${expense.mainCategory}"
									th:data-sub-category="${expense.subCategory}"
						            th:data-amount="${expense.amount}"
						            th:data-note="${expense.note}">							
						        	⚙️🗑
							    </button>							
							</td>	
		                </tr>			
	                    
	                   <!-- NO DATA -->
				    	<tr th:if="${#lists.isEmpty(expenseList)}">
					        <td colspan="6"
					            class="text-center text-danger fw-bold">
					            希望のデータが見つかりません。
					        </td>
				        </tr>
	                </tbody>
	
	            </table>
	        </div>
		</div>	
	</div>	
	</div>
</div>
	
</body>
</html>
