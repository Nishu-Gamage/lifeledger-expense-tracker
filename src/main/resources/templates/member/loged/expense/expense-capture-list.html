<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense List</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- LIST EXPENSE MODAL -->
<div th:fragment="addExpenseListModal" class="modal fade" id="searchAddListExModal" tabindex="-1">     
    <div class="modal-dialog modal-xl">
        <div class="modal-content p-4">
        
            <form th:action="@{/addListofExpense}" method="post" class="d-flex flex-column flex-grow-1">

                <!-- TITLE -->
                <div class="text-center mb-3">
                    <h2 class="fw-bold text-primary">経費を一覧登録</h2>
                </div>

				<!-- TABLE WRAPPER -->
				<div class="expense-table-wrapper">
	                <!-- TABLE -->
	                <table class="table table-striped table-bordered align-middle">
	
	                    <thead class="table-primary">	
		                    <tr class="text-center">		
		                        <th>Date</th>
		                        <th>Cost</th>
		                        <th>MainCategory</th>
		                        <th>SubCategory</th>
		                        <th>Note</th>
		                        <th>Action</th>		
		                    </tr>	
	                    </thead>
	
	                    <tbody>	
	                    <tr>	
	                        <!-- DATE -->
	                        <td>
	                            <input type="date" name="expenseDate" class="form-control shadow-sm"
	                                   th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" required>
	                        </td>
	
	                        <!-- COST -->
	                        <td>							       
						       <input type="text" class="form-control text-end shadow-sm list-amount"
								       placeholder="0" inputmode="numeric" autocomplete="off" required>	
								       							
								<input type="hidden" name="amount">
	                        </td>
	                        
	                        <!-- MAIN CATEGORY -->
							<td>
							    <select class="form-select main-category" name="mainCategory" required></select>
							</td>
	
	                        <!-- SUB CATEGORY -->
							<td>
							    <select class="form-select sub-category" name="subCategory" required>
							        <option value="">Select</option>
							    </select>
							</td>
	
	                        <!-- NOTE -->
	                        <td>
	                            <input type="text" class="form-control" name="note" placeholder="Add note hear">
	                        </td>
	
	                        <!-- DELETE -->
	                        <td class="text-center">
	                            <button type="button" class="btn btn-danger btn-sm delete-row">削除</button>
	                        </td>
	                    </tr>
	                    
	                    </tbody>
	                </table>
                </div>

                <!-- BUTTONS -->
				<div class="d-flex justify-content-center gap-3 mt-4 modal-buttons-sticky">				
				    <!-- ADD -->
				    <button type="button" class="btn btn-secondary">追加</button>				
				    <!-- CLEAR -->
				    <button type="button" class="btn btn-danger clear-all-rows">全てをクリア</button>				
				    <!-- SAVE -->
				    <button type="button" class="btn btn-primary" id="openConfirmModalBtn">経費登録　</button>			
				</div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
