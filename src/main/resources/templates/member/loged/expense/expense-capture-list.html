<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense List</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- LIST EXPENSE MODAL -->
<div th:fragment="addExpenseListModal"
     class="modal fade"
     id="searchAddListExModal"
     tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content p-4">

            <form th:action="@{/addExpense}" method="post">

                <!-- TITLE -->
                <div class="text-center mb-3">

                    <h2 class="fw-bold text-primary">
                        経費を一覧登録
                    </h2>

                </div>

                <!-- TABLE -->
                <table class="table table-striped table-bordered align-middle">

                    <thead class="table-primary">

                    <tr class="text-center">

                        <th>Date</th>
                        <th>Cost</th>
                        <th>MainCategory</th>
                        <th>SubCategory</th>
                        <th>Note</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <!-- DATE -->
                        <td>

                            <input type="date"
                                   name="expenseDate"
                                   class="form-control shadow-sm"
                                   th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"
                                   required>

                        </td>

                        <!-- COST -->
                        <td>

                            <input type="tel"
                                   id="listAmount"
                                   name="amount"
                                   class="form-control text-end shadow-sm"
                                   placeholder="0"
                                   inputmode="numeric"
                                   autocomplete="off"
                                   required>

                        </td>

                        <!-- MAIN CATEGORY -->
                        <td>

                            <input type="text"
                                   class="form-control"
                                   name="mainCategory">

                        </td>

                        <!-- SUB CATEGORY -->
                        <td>

                            <input type="text"
                                   class="form-control"
                                   name="subCategory">

                        </td>

                        <!-- NOTE -->
                        <td>

                            <input type="text"
                                   class="form-control"
                                   name="note">

                        </td>

                        <!-- DELETE -->
                        <td class="text-center">

                            <button type="button"
                                    class="btn btn-danger btn-sm">

                                削除

                            </button>

                        </td>

                    </tr>

                    </tbody>

                </table>

                <!-- BUTTONS -->
                <div class="d-flex justify-content-center gap-3 mt-4">

                    <!-- ADD -->
                    <button type="button"
                            class="btn btn-secondary w-25">

                        追加

                    </button>

                    <!-- SAVE -->
                    <button type="submit"
                            class="btn btn-primary w-25">

                        Save Expense

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
