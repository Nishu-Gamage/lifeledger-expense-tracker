<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
<div class="container" th:fragment="exp-menu2">

    <!-- Search Area -->
    <div class="card shadow-sm">
        <div class="card-body">        	
    	<form id="dailyFilterForm" method="get">
    		<input type="hidden" name="tab" value="daily">
    		
            <div class="row justify-content-center align-items-end">
                <div class="col-2">
                    <label class="form-label fw-bold">開始日</label>
                    <input type="date" name="fromDate" class="form-control bg-primary text-white" th:value="${fromDate}">
                </div>

                <div class="col-auto text-center fs-4 pb-2">
                    ～
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-bold">終了日</label>
                    <input type="date" name="toDate" class="form-control bg-primary text-white" th:value="${toDate}">
                </div>
                
                <div class="col-md-2 ms-5">
                    <label class="form-label fw-bold">メインカテゴリー</label>
					<select class="form-select"
							name="dailyMainCategory"
							id="dailyMainCategoryFilter">
					  <option value=""
						  	th:selected="${dailyMainCategory == null or dailyMainCategory == ''}">
						  	全て
				  		</option>
					</select>
                </div>
                
                <div class="col-md-2">
                    <label class="form-label fw-bold">サブカテゴリー</label>
					<select class="form-select"
							name="dailySubCategory"
							id="dailySubCategoryFilter">
					  <option value="">全て</option>
					</select>
                </div>

                <div class="col text-center">
                    <button class="btn btn-primary px-4">検索</button>
                    <button type="button" id="dailyClearBtn" class="btn btn btn-danger px-4 ms-2">クリア</button>
                </div>
            </div>
        </form>
        </div>
    </div>
    
    <div class="card shadow-sm mt-4">
        <div class="card-body p-0">
        	<div class="table-scroll">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
	                <tr>
	                    <th  class="py-0">日付</th>
	                    <th class="py-0">メインカテゴリー</th>
	                    <th class="py-0">サブカテゴリー</th>
	                    <th class="py-0 text-end">費用</th>
	                    <th class="py-0 w-50">ノート</th>
	                </tr>
                </thead>

                <tbody>
	                <tr th:each="expense : ${dailyExpenseList}">
				        <td class="py-0" th:text="${expense.expenseDate}"></td>
				        <td class="py-0" th:text="${expense.mainCategory}"></td>
				        <td class="py-0" th:text="${expense.subCategory}"></td>
				        <td class="py-0 text-end"
				            th:text="${#numbers.formatDecimal(expense.amount,0,'COMMA',0,'POINT')} + ' 円' ">
				        </td>
				        <td class="py-0" th:text="${expense.note}"></td>
				    </tr>
	                
				    <tr th:if="${#lists.isEmpty(dailyExpenseList)}">
				        <td colspan="5" class="text-center">
				            データがありません
				        </td>
				    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
    	<div class="col-md-4">
	        <table class="table table-striped table-bordered text-center">
	       		<thead class="table-warning sticky-top">
		            <tr>
		                <th class="py-0">経費合計</th>
		            </tr>
	            </thead>
	            <tbody>
	                <tr>
	                    <td class="fs-4 py-2 fw-bold text-primary"
						    th:text="${#numbers.formatDecimal(totalAmount,0,'COMMA',0,'POINT')}+ ' 円' ">
						</td>
	                </tr>
	            </tbody>
	        </table>
	    </div>
    </div>

</div>
	
</body>
</html>
