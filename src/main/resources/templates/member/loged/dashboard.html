<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">
<title>Life Ledger</title>
    <link rel="stylesheet" th:href="@{/css/style-dashboard.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<!-- HEADER -->
<header class="navbar navbar-expand-lg justify-content-between align-items-center navbar-light" style="background-color:lightgray;">
	
	<a th:href="@{/}" class="btn navbar-brand text-body mx-3">Life Ledger</a>
	
   	<div sec:authorize="hasRole('USER')">
	    <button class="btn btn-link text-dark add-expense-link fs-5 mx-3 p-0"
	            data-bs-toggle="modal"
	            data-bs-target="#searchErrorModal">
	        Add Expense
	    </button>
	</div>
	
    <!-- LOGOUT -->
    <div sec:authorize="hasRole('USER')">
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger mx-3">ログアウト</button>
        </form>
    </div>
    
</header>

<!-- PAGE CONTENT -->


<!-- LOAD MODAL -->
<div th:replace="member/loged/dataCapture/expense-capture :: search-condition"></div>

<!-- LOAD JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/expense-capture.js}"></script>

</body>
</html>
