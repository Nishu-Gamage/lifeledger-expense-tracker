<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Income</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style-header.css}">
    <link rel="stylesheet" th:href="@{/css/style-dashboard-tabs.css}">
</head>
<body>

<!-- HEADER -->
<div th:replace="~{includes/header :: header}"></div>

<!-- PAGE CONTENT -->
<div class="container mt-3">
    <h2 class="mb-2 text-center">収入ダッシュボード画面</h2>
	
	<!-- NAV TABS -->
    <ul class="nav nav-tabs nav-fill border-0 shadow-sm dashboard-tabs" role="tablist">

        <li class="nav-item">
	        <button class="nav-link fw-semibold"
	                th:classappend="${activeTab != 'monthly'} ? ' active' : ''"
	                data-bs-toggle="tab"
	                data-bs-target="#income-home"
	                type="button">
	            今月の収入概要
	        </button>
	    </li>
        
		<li class="nav-item">
	        <button class="nav-link fw-semibold"
	                th:classappend="${activeTab == 'monthly'} ? ' active' : ''"
	                data-bs-toggle="tab"
	                data-bs-target="#income-menu1"
	                type="button">
	            収入の月間比較
	        </button>
	    </li>
    </ul>
	
	<!-- TAB CONTENT --> 
    <div class="tab-content mt-2 dashboard-tab-content">

	    <div id="income-home"
	         class="tab-pane fade"
	         th:classappend="${activeTab != 'monthly'} ? ' show active' : ''">
	
	        <div th:replace="member/loged/income/summary-income :: content"></div>	
	    </div>
	
	    <div id="income-menu1"
	         class="tab-pane fade"
	         th:classappend="${activeTab == 'monthly'} ? ' show active' : ''">
	
	        <div th:replace="member/loged/income/monthly-income :: content"></div>	
	    </div>
	    
	</div>
	
 </div>
 
<!-- BUTTONS -->
<div class="d-flex justify-content-center align-items-center gap-3 py-3">

    <!-- ADD INCOME -->
    <div sec:authorize="hasRole('USER')">
        <button type="button"
                class="btn btn-success btn-lg px-4 py-2"
                data-bs-toggle="modal"
                data-bs-target="#searchaddIncomeModal">
            収入を個別登録
        </button>
    </div>

</div>
 
<!-- LOAD MODALS -->
<div th:replace="~{member/loged/income/income-capture :: addIncomeModal}"></div>
<div th:replace="~{member/loged/income/income-confirm :: confirmIncomeModal}"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/income-capture.js}"></script>

<script th:inline="javascript">	
	window.showIncomeConfirm = /*[[${showIncomeConfirm}]]*/ false;
    console.log("showIncomeConfirm = ", window.showIncomeConfirm);
</script>


</body>
</html>
