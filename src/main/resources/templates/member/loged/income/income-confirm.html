<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Income</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>


<div th:fragment="confirmIncomeModal" class="modal fade" id="confirmIncomeModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <form th:action="@{/addIncome}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <!-- HEADER -->
                <div class="container text-center mb-3">
                	<h2 class="fw-bold text-primary">収入を再確認</h2>
                </div>
                <table class="table">
	                <tr>
	                    <th class="w-25">日付</th>
	                    <td id="confirmIncomeDate" class="w-75" th:text="${income.incomeDate}"></td>
	                </tr>
	
	                <tr>
	                    <th class="w-25">収入カテゴリー</th>
	                    <td id="confirmCategory" class="w-75" th:text="${income.category}"></td>
	                </tr>
	
	                <tr>
	                    <th class="w-25">収入額</th>
	                    <td id="confirmAmount" class="w-75" th:text="${income.amount}"></td>
	                </tr>
	
	                <tr>
	                    <th class="w-25">ノート</th>
	                    <td id="confirmNote" class="w-75" th:text="${income.noteText}"></td>
	                </tr>

            	</table>
                
                
                <div class="text-center">
            
			    <!-- BACK -->
                <button type="button" class="btn btn-secondary" id="backToCaptureModalBtn">戻る</button>								
			    <!-- SAVE -->
			    <button type="button" class="btn btn-primary" id="saveIncomeBtn">経費登録　</button>	
			    <!-- CANCEL -->
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">キャンセル</button>	
            </div>
            
                
                
			</form>
		</div>
	</div>
</div>

</body>
</html>
