<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="content">
	<div class="row justify-content-center">
	    <div class="col-8">
	        <table class="table table-striped custab">
			    <thead>
			        <tr>
			            <th colspan="5">	
			           		<form th:action="@{/monthly-income}" method="get">		           		
    							<input type="hidden" name="tab" value="monthly">
    							
    							<select class="py-0 bg-primary text-white form-select text-center"
							            name="year"
							            onchange="this.form.submit()">
							
								    <option th:each="y : ${years}"
								            th:value="${y}"
								            th:text="${y + '年'}"
								            th:selected="${y == currentYear}">
								    </option>
								
								</select>
							</form>
			            </th>
			        </tr>
			        <tr>
			            <th class="py-0">月</th>
			            <th class="w-50 py-0 text-end">総収入</th>
			            <th class="w-50 py-0 text-center">トップカテゴリー</th>
			        </tr>
			    </thead>
			    <tbody>					
					<tr>
					    <td class="py-0 ">1</td>		
					    <td class="py-0 text-end">100 円</td>					
					    <td class="py-0 text-center">ボーナス</td>	
					</tr>			
					<tr>
					    <td class="py-0 ">2</td>		
					    <td class="py-0 text-end">100 円</td>				
					    <td class="py-0 text-center">ボーナス</td>	
					</tr>			
					<tr>
					    <td class="py-0 ">3</td>		
					    <td class="py-0 text-end">100 円</td>				
					    <td class="py-0 text-center">ボーナス</td>	
					</tr>			
					<tr>
					    <td class="py-0 ">4</td>		
					    <td class="py-0 text-end">1500 円</td>				
					    <td class="py-0 text-center">ボーナス</td>	
					</tr>
				</tbody>
		    </table>
		</div>
    </div>

</div>

</body>
</html>
