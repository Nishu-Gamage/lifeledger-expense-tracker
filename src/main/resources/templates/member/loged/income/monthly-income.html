<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="content">
	<div class="row justify-content-center">
	    <div class="col-8">
	        <table class="table table-striped custab">
			    <thead>
			        <tr>
			            <th colspan="5">
			           		<form th:action="@{/income}" method="get">	           		
    							<input type="hidden" name="tab" value="monthly">
    							
    							<select class="py-0 bg-primary text-white form-select text-center"
							            name="comparisonYear"
							            onchange="this.form.submit()">
							
								    <option th:each="y : ${years}"
								            th:value="${y}"
								            th:text="${y + '年'}"
								            th:selected="${y == comparisonYear}">
								    </option>
								
								</select>
							</form>
			            </th>
			        </tr>
			        <thead>
					    <tr>
					        <th class="py-0">月</th>
					        <th class="py-0 text-end">総収入</th>
					        <th class="text-center py-0">今月のトップカテゴリー</th>
					    </tr>
					</thead>
					
					<tbody>
					    <tr th:each="row : ${monthlyIncomeSummary}">
					        <td class="py-0" th:text="${row.month}"></td>
					        <td class="py-0 text-end"
							    th:text="${#numbers.formatInteger(row.totalIncome != null ? row.totalIncome : 0, 1, 'COMMA')} + ' 円'">
							</td>
					        <td class="w-50 py-0 text-center" th:text="${row.topCategory}"></td>
					    </tr>
					</tbody>
				</tbody>
		    </table>
		</div>
    </div>

</div>

</body>
</html>
