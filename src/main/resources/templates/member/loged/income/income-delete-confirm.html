<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="incomeDeleteConfirmModal">

    <div class="modal fade"
         id="incomeDeleteConfirmModal"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="text-center mb-3">
                    <h3 class="text-danger">
                        削除確認
                    </h3>
                </div>

                <div class="text-center mb-2">
                    <h5 class="text-danger">
                        登録された収入情報を削除しますか？
                    </h5>

                </div>
                <div class="table-responsive">
				    <table class="table table-bordered">				
				        <tr>
				            <th class="w-25">日付</th>
				            <td id="deleteIncomeDate"></td>
				        </tr>
				
				        <tr>
				            <th>カテゴリー</th>
				            <td id="deleteIncomeCategory"></td>
				        </tr>
				
				        <tr>
				            <th>収入</th>
				            <td id="deleteIncomeAmount"></td>
				        </tr>
				
				        <tr>
				            <th>ノート</th>
				            <td id="deleteIncomeNote"></td>
				        </tr>
				
				    </table>				
				</div>

                <div class="d-flex justify-content-center gap-3">
                    <button type="button"
                            class="btn btn-secondary"
                            id="backToEditModal">
                        戻る
                    </button>

                    <button type="button"
                            class="btn btn-danger">
                        削除
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
