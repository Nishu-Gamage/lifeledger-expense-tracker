<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div th:fragment="addIncomeModal" class="modal fade" id="searchaddIncomeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <form th:action="@{/addIncome}" method="post">

                <!-- HEADER -->
                <div class="container text-center mb-3">
                	<h2 class="fw-bold text-primary">収入を追加</h2>
                </div>
                
                <div class="container text-center mb-4"></div>
                    <div class="form-group row ms-3">
                        <label for="incomedate" class="col-4">日付</label> 
                        <div class="col-8">
                        	<div class="input-group">
                                <input id="firstName" name="text" type="text" class="form-control form-control-sm" required>
                        	</div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="incomeCategory" class="col-4">収入カテゴリー</label> 
                        <div class="col-8">
                          <div class="input-group"> 
                            <select id="position" class="form-select form-control-sm" required>
                                <option></option>
                                <option>給与</option>
                                <option>ボーナス</option>
                                <option>事業収入</option>
                                <option>贈与</option>
                                <option>パートタイムの仕事</option>
                            </select>
                            
                          </div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="income" class="col-4">収入額</label> 
                        <div class="col-8">
                          <div class="input-group">
                          	<input id="firstName" name="text" type="text" class="form-control form-control-sm" required>
                          </div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="incomeNote" class="col-4">ノート</label> 
                        <div class="col-8">
                          <div class="input-group">
                            <input id="cell" name="text" type="text" class="form-control form-control-sm">
                          </div>
                        </div>
                    </div>
                
				<div class="d-flex justify-content-center gap-3 mt-5">
				    <!-- CLEAR -->
				    <button type="button" id="clearExpenseFormBtn" class="btn btn-danger ">Clear</button>				
				    <!-- SUBMIT -->
				    <button type="submit" class="btn btn-primary">Save Expense</button>
				    <!-- CANCEL -->
				    <button type="button" class="btn btn-danger">Cancel</button>			
				</div>
				
            </form>
        </div>
    </div>
</div>

</body>
</html>
