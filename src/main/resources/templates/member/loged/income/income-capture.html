<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Income</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
          
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<div th:fragment="addIncomeModal" class="modal fade" id="searchaddIncomeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <form th:action="@{/addIncome}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<input type="hidden" name="sourcePage" th:value="${sourcePage}">
                <!-- HEADER -->
                <div class="container text-center mb-3">
                	<h2 class="fw-bold text-primary">収入を追加</h2>
                </div>
                
                <div class="container text-center mb-4">
                    <div class="form-group row ms-3">
                        <label for="incomedate" class="col-4">日付</label> 
                        <div class="col-8">
                        	<div class="input-group">
                                <input type="date" id="incomedate" name="incomeDate" class="form-control"
                                       th:value="${#dates.format(#dates.createNow(),'yyyy-MM-dd')}" required>
                        	</div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="incomeCategory" class="col-4">収入カテゴリー</label> 
                        <div class="col-8">
                          <div class="input-group">
                            <select id="position" name="category" class="form-select form-control-sm" required>
  								<option value="" disabled="disabled" selected="selected">カテゴリーを選択</option>
                                <option value="給与">給与</option>
                                <option value="ボーナス">ボーナス</option>
                                <option value="事業収入">事業収入</option>
                                <option value="贈与">贈与</option>
                                <option value="パートタイムの仕事">パートタイムの仕事</option>
                            </select>
                            
                          </div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="income" class="col-4">収入額</label> 
                        <div class="col-8">
                          <div class="input-group">
					      	<input type="tel"
						       id="amountDisplay"
						       class="form-control text-end"
						       placeholder="0"
						       inputmode="numeric"
						       autocomplete="off"
						       required>
							
							<input type="hidden"
						       id="amount"
						       name="amount">
                          </div>
                        </div>
                    </div>
                    <div class="form-group row align-items-center mt-4 ms-3">
                        <label for="incomeNote" class="col-4">ノート</label> 
                        <div class="col-8">
                          <div class="input-group">
                            <input id="cell" name="noteText" type="text" class="form-control form-control-sm" placeholder="ノートを入力">
                          </div>
                        </div>
                    </div>
                </div>
				<div class="d-flex justify-content-center gap-3 mt-5">
				    <!-- CLEAR -->
				    <button type="button" id="clearExpenseFormBtn" class="btn btn-danger ">クリア</button>				
				    <!-- SUBMIT -->
				    <button type="submit" class="btn btn-primary">収入登録</button>
				    <!-- CANCEL -->
				    <button type="button" class="btn btn-danger" id="cancelBtn">キャンセル</button>
				</div>
				
            </form>
        </div>
    </div>
</div>

</body>
</html>
