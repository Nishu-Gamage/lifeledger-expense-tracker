<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="content">

	<!-- SELECT YEAR & MONTH -->
	<form method="get" th:action="@{/income}">
	    <div class="d-flex align-items-center gap-1 mb-1">	
	        <select name="year"
	                class="form-select form-select-sm w-auto border-success bg-primary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="y : ${years}"
	                    th:value="${y}"
	                    th:text="${y}"
	                    th:selected="${y == selectedYear}">
	            </option>	
	        </select>
	
	        <select name="month"
	                class="form-select form-select-sm w-auto border-success bg-secondary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="m : ${#numbers.sequence(1,12)}"
	                    th:value="${m}"
	                    th:text="${m + '月'}"
	                    th:selected="${m == selectedMonth}">
	            </option>	
	        </select>	
	    </div>	
	</form>
	
	<!-- INCOME TOP SUMMARY TABLE -->
	<div class="row justify-content-center">
	    <div class="col-10">
	        <table class="table table-striped table-bordered text-center">
	            <thead class="table-success">
	                <tr>
	                    <th class="py-0 w-25">総収入</th>
	                    <th class="py-0 w-25">トップカテゴリー</th>
	                </tr>
	            </thead>	
	            <tbody>
	                <tr>
		                <td class="fs-4 py-2 fw-bold text-primary"
						    th:text="${#numbers.formatInteger(totalIncome,0,'COMMA')}">
						</td>
	                    <td class="fs-4 py-2 fw-bold text-primary">旅行</td>
	                </tr>
	            </tbody>	
	        </table>	
	    </div>	
	</div>
	
    <!-- REVENUE OVERVIEW BY CATEGORRY -->
    <h4 class="fw-bold text-success mx-5">
        カテゴリー別収入概要
    </h4>
	
	<!-- REVENUE OVERVIEW BY CATEGORRY TABLE -->
	<div class="row justify-content-center">
	    <div class="col-8">
            <!-- SCROLL AREA -->
			<div style="max-height: 100px; overflow-y: auto;">
		        <table class="table table-bordered table-striped text-center">		
		            <thead class="table-warning sticky-top">
		                <tr>
		                    <th class="w-50 py-1">メインカテゴリー</th>
		                    <th class="w-50 py-1">収入</th>
		                </tr>
		            </thead>	
		            
	             	<tbody>
		             	<tr>
		                    <td class="py-1 w-25">test</td>
		                    <td class="py-1 w-25">100</td>
	                    </tr>
		             	<tr>
		                    <td class="py-1 w-25">test</td>
		                    <td class="py-1 w-25">100</td>
	                    </tr>
		             	<tr>
		                    <td class="py-1 w-25">test</td>
		                    <td class="py-1 w-25">100</td>
	                    </tr>
		        </table>
			</div>
	    </div>
	</div>
	
	<!-- ALL INCOME INFORMATION -->
    <h4 class="fw-bold text-success mx-5">
        すべての収入情報
    </h4>
	
	<!-- ALL INCOME INFORMATION TABLE -->
	<div class="row justify-content-center">
	    <div class="col-12">
            <!-- SCROLL AREA -->
			<div style="max-height: 100px; overflow-y: auto;">
		        <table class="table table-bordered table-striped text-center">		
		            <thead class="table-warning sticky-top">
		                <tr>
		                    <th class=" py-1">日付</th>
		                    <th class=" py-1">カテゴリー</th>
		                    <th class=" py-1">収入</th>
		                    <th class=" py-1">ノート</th>
		                    <th class=" py-1">更新/削除</th>
		                </tr>
		            </thead>	
		            
	             	<tbody>
		             	<tr>
		                    <td class="py-1">2026/6/5</td>
		                    <td class="py-1">給与</td>
		                    <td class="py-1">100,000</td>
		                    <td class="py-1">TOAグループ</td>
		                    <td class="py-1">⚙️　🗑</td>
	                    </tr>
		             	<tr>
		                    <td class="py-1">2026/6/5</td>
		                    <td class="py-1">給与</td>
		                    <td class="py-1">100,000</td>
		                    <td class="py-1">TOAグループ</td>
		                    <td class="py-1">⚙️　🗑</td>
	                    </tr>
		             	<tr>
		                    <td class="py-1">2026/6/5</td>
		                    <td class="py-1">給与</td>
		                    <td class="py-1">100,000</td>
		                    <td class="py-1">TOAグループTOAグループ</td>
		                    <td class="py-1">⚙️　🗑</td>
	                    </tr>
		        </table>
			</div>
	    </div>
	</div>
	
</div>

</body>
</html>
