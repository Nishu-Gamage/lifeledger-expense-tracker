<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="content">

	<!-- SELECT YEAR & MONTH -->
	<form method="get" th:action="@{/income}">
	    <div class="d-flex align-items-center gap-1 mb-1">	
	        <select name="summaryYear"
	                class="form-select form-select-sm w-auto border-success bg-primary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="y : ${years}"
	                    th:value="${y}"
	                    th:text="${y}"
	                    th:selected="${y == selectedYear}">
	            </option>	
	        </select>
	
	        <select name="month"
	                class="form-select form-select-sm w-auto border-success bg-secondary text-white"
	                onchange="this.form.submit()">
	
	            <option th:each="m : ${#numbers.sequence(1,12)}"
	                    th:value="${m}"
	                    th:text="${m + '月'}"
	                    th:selected="${m == selectedMonth}">
	            </option>	
	        </select>	
	    </div>	
	</form>
	
	<!-- INCOME TOP SUMMARY TABLE -->
	<div class="row justify-content-center">
	    <div class="col-12">
		    
		    <div class="row justify-content-center">

			    <!-- Table 1 -->
			    <div class="col-md-4">
			        <table class="table table-striped table-bordered text-center">
                		<thead class="table-warning sticky-top">
			                <tr>
			                    <th class="py-0">総収入</th>
			                </tr>
		                </thead>
			            <tbody>
			                <tr>
			                    <td class="fs-4 py-2 fw-bold text-primary"
			                        th:text="'¥ ' + ${#numbers.formatInteger(totalIncome,0,'COMMA')}">
			                    </td>
			                </tr>
			            </tbody>
			        </table>
			    </div>
			
			    <!-- Table 2 -->
			    <div class="col-md-4 ms-5">
			        <table class="table table-striped table-bordered text-center">
                		<thead class="table-warning sticky-top">
			                <tr>
			                    <th class="py-0">今月のトップカテゴリー</th>
			                </tr>
			            </thead>
			            <tbody>
			                <tr>
								<td class="fs-4 py-2 fw-bold text-primary"
								    th:text="${topCategory}">
								</td>
			                </tr>
			            </tbody>
			        </table>
			    </div>			
			</div>
	    </div>	
	</div>
	
	<div class="row justify-content-center gx-5">

    <!-- CATEGORY SUMMARY -->
    <div class="col-lg-3 mt-1">
    	<div class="p-3 rounded shadow-sm border" style="background-color:#008B8B;">
        	<h5 class="fw-bold text-white mb-3 text-center">
	            カテゴリー別収入概要
	        </h5>
	
	        <div style="max-height: 200px; overflow-y: auto;">
            <table class="table table-bordered table-striped text-center mb-0">
	                <thead class="table-warning sticky-top">
	                    <tr>
	                        <th>メインカテゴリー</th>
	                        <th>収入</th>
	                    </tr>
	                </thead>
	
	                <tbody>
	                    <tr th:each="item : ${incomeCategorySummary}">
	                        <td th:text="${item.category}"></td>
	                        <td th:text="${#numbers.formatInteger(item.totalAmount,0,'COMMA')}"></td>
	                    </tr>
	                    
	                    <!-- NO DATA -->
					    <tr th:if="${#lists.isEmpty(incomeCategorySummary)}">
					
					        <td colspan="2" class="text-center text-danger fw-bold">					
					            希望のデータが見つかりません。					
					        </td>
						
					    </tr>
	                </tbody>
	            </table>
	        </div>
        </div>
    </div>

    <!-- ALL INCOME -->
    <div class="col-lg-8 mt-1">
    	<div class="p-3 rounded shadow-sm border" style="background-color:#5F9EA0;">
       	<h5 class="fw-bold text-white mb-3 text-center">
            すべての収入情報
        </h5>

        <div style="max-height: 200px; overflow-y: auto;">
            <table class="table table-bordered table-striped text-center mb-0">
                <thead class="table-warning sticky-top">
                    <tr>
                        <th style="width:15%">日付</th>
                        <th style="width:18%">カテゴリー</th>
                        <th style="width:15%">収入</th>
                        <th style="width:25%">ノート</th>
                        <th style="width:15%">更新/削除</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="income : ${incomeList}">
                        <td th:text="${income.incomeDate}"></td>
                        <td th:text="${income.category}"></td>
                        <td th:text="${#numbers.formatInteger(income.amount,0,'COMMA')}"></td>
                        <td th:text="${income.noteText}"></td>
                        <td class="py-1">
						    <button type="button"
						            class="btn btn-sm btn-outline-secondary incomeEditBtn"
						
						            data-bs-toggle="modal"
						            data-bs-target="#incomeEditModal"
						
						            th:data-id="${income.id}"
						            th:data-date="${income.incomeDate}"
						            th:data-category="${income.category}"
						            th:data-amount="${income.amount}"
						            th:data-note="${income.noteText}">							
						        ⚙️🗑							
						    </button>							
						</td>			
                    </tr>
                    
                   <!-- NO DATA -->
			    	<tr th:if="${#lists.isEmpty(incomeList)}">
			        <td colspan="5"
			            class="text-center text-danger fw-bold">
			            希望のデータが見つかりません。
			        </td>
                </tbody>

            </table>
        </div>
        </div>
    </div>
	</div>
</div>
	
</body>
</html>
