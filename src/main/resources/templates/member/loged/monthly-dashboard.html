<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

<div th:fragment="content">
	<div class="row justify-content-center">
	    <div class="col-8">
	        <table class="table table-striped custab">
			    <thead>
			        <tr>
			            <th colspan="5">	
			           		<form th:action="@{/dashboard}" method="get">		           		
    							<input type="hidden" name="tab" value="monthly">
    							
    							<select class="py-0 bg-primary text-white form-select text-center"
							            name="year"
							            onchange="this.form.submit()">
							
								    <option th:each="y : ${years}"
								            th:value="${y}"
								            th:text="${y + '年'}"
								            th:selected="${y == currentYear}">
								    </option>
								
								</select>
							</form>
			            </th>
			        </tr>
			        <tr>
			            <th class="w-25 py-0">月</th>
			            <th class="w-25 py-0 text-end">総収入</th>
			            <th class="w-25 py-0 text-end">総支出額</th>
			            <th class="w-25 py-0 text-end">残高</th>
			        </tr>
			    </thead>
			    <tbody>					
					<tr th:each="item : ${monthlySummaries}">
					    <td class="py-0" th:text="${item.month}"></td>
					
					    <td class="py-0 text-end"
    						th:text="${#numbers.formatInteger(item.totalIncome, 1, 'COMMA')} + ' 円'">
					        
					    </td>
					
					    <td class="py-0 text-end"
   							th:text="${#numbers.formatInteger(item.totalExpense, 1, 'COMMA')} + ' 円'">
					    </td>
					    					    
					    <td class="py-0 text-end"
						    th:classappend="${(item.totalIncome - item.totalExpense) <= 0} ? ' text-danger' : ' text-dark'"
   							th:text="${#numbers.formatInteger(item.totalIncome - item.totalExpense, 1, 'COMMA')} + ' 円'">
						</td>
					    										
					</tr>
				</tbody>
		    </table>
		</div>
    </div>
</div>

</body>
</html>
